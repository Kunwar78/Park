<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCN Search - Demo Parking Authority</title><link rel="stylesheet" href="style.css"></head><body>
<div class="demo-banner">Fictional practice project. Not a real authority. No real fines or payments.</div>
<header><div class="name">DEMO PARKING AUTHORITY</div><div class="sub">STUDY PROJECT</div></header>
<div class="band"></div>
<main>
 <h1>PCN Details</h1>
 <p>Enter the details exactly as printed on your demo notice.</p>
 <form id="f" autocomplete="off">
  <div class="row"><label for="vrn">Vehicle Registration Number *</label><input id="vrn"></div>
  <div class="row"><label for="pcn">Penalty Charge Notice (PCN) *</label><input id="pcn"></div>
  <div class="err" id="err"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn">Search</button></div>
 </form>
</main>
<footer>© 2026 Demo Parking Authority (fictional) · <a href="admin.html" style="color:#ddd">Admin</a></footer>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const vrn = vrn_.value.trim(), pcn = pcn_.value.trim(), err = document.getElementById('err');
  if (!vrn || !pcn) { err.textContent = 'Please enter both fields.'; return; }
  const r = await fetch('/api/lookup', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({vrn,pcn})});
  if (!r.ok) { err.textContent = 'No matching record found.'; return; }
  location.href = 'pcn.html?vrn=' + encodeURIComponent(vrn) + '&pcn=' + encodeURIComponent(pcn);
});
const vrn_ = document.getElementById('vrn'), pcn_ = document.getElementById('pcn');
</script></body></html>
